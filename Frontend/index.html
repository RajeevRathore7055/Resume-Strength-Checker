<script>

const API = window.location.origin;

let jdSkills = [];

async function uploadJD() {

    const file = document.getElementById("jdFile").files[0];

    if (!file) {
        alert("Please select JD file");
        return;
    }

    const btn = document.getElementById("jdBtn");
    btn.disabled = true;

    document.getElementById("output").innerHTML =
        "<div class='loading'>⏳ Processing JD...</div>";

    const formData = new FormData();
    formData.append("file", file);

    try {

        const res = await fetch(API + "/upload-jd/", {
            method: "POST",
            body: formData
        });

        if (!res.ok) {
            throw new Error("JD Upload Failed");
        }

        const data = await res.json();

        jdSkills = data.jd_skills || [];

        document.getElementById("output").innerHTML = `
            <h3 class="success">✅ JD Uploaded Successfully</h3>

            <div class="skills-section">
                <h4>🔍 Detected JD Skills (${jdSkills.length})</h4>

                ${
                    jdSkills.length
                    ? jdSkills.map(
                        s => `<span class="badge">${s}</span>`
                    ).join("")
                    : "<p style='color:#94a3b8'>No skills detected</p>"
                }
            </div>
        `;

    } catch (e) {

        console.error(e);

        document.getElementById("output").innerHTML =
            `<div class="error-msg">❌ ${e.message}</div>`;

    } finally {

        btn.disabled = false;

    }
}


async function uploadResume() {

    if (!jdSkills.length) {
        alert("Upload JD first!");
        return;
    }

    const file = document.getElementById("resumeFile").files[0];

    if (!file) {
        alert("Select a Resume file");
        return;
    }

    const btn = document.getElementById("resumeBtn");
    btn.disabled = true;

    document.getElementById("output").innerHTML =
        "<div class='loading'>⏳ Analyzing Resume...</div>";

    const formData = new FormData();

    formData.append("file", file);
    formData.append("jd_skills", JSON.stringify(jdSkills));

    try {

        const res = await fetch(API + "/upload-resume/", {
            method: "POST",
            body: formData
        });

        if (!res.ok) {
            throw new Error("Resume Upload Failed");
        }

        const data = await res.json();

        const score = data.match_score || 0;
        const matched = data.matched || [];
        const missing = data.missing || [];

        document.getElementById("scoreCircle").innerHTML =
            score + "%";

        document.getElementById("scoreCircle").style.background =
            `conic-gradient(
                #06b6d4 ${score * 3.6}deg,
                #1e293b ${score * 3.6}deg
            )`;

        document.getElementById("output").innerHTML = `

            <h3 class="success">
                ✅ Resume Analysis Complete
            </h3>

            <hr class="divider">

            <div class="skills-section">

                <h4>✅ Matched Skills (${matched.length})</h4>

                ${
                    matched.length
                    ? matched.map(
                        s => `<span class="badge matched">✅ ${s}</span>`
                    ).join("")
                    : "<p style='color:#94a3b8'>No skills matched</p>"
                }

            </div>

            <div class="skills-section">

                <h4>❌ Missing Skills (${missing.length})</h4>

                ${
                    missing.length
                    ? missing.map(
                        s => `<span class="badge missing">❌ ${s}</span>`
                    ).join("")
                    : "<p style='color:#22c55e'>All JD skills matched! 🎉</p>"
                }

            </div>

            <hr class="divider">

            <div class="skills-section">

                <h4>📄 JD Skills</h4>

                ${
                    (data.jd_skills || []).map(
                        s => `<span class="badge">${s}</span>`
                    ).join("")
                }

            </div>

            <div class="skills-section">

                <h4>📑 Resume Skills</h4>

                ${
                    (data.resume_skills || []).map(
                        s => `<span class="badge">${s}</span>`
                    ).join("")
                }

            </div>

            <hr class="divider">

            <p style="color:#94a3b8;font-size:13px">
                📁 File: ${data.filename || ""}
            </p>
        `;

    } catch (e) {

        console.error(e);

        document.getElementById("output").innerHTML =
            `<div class="error-msg">❌ ${e.message}</div>`;

    } finally {

        btn.disabled = false;

    }
}

</script>
